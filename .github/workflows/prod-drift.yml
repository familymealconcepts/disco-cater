# Production drift check: is the live site running the latest commit on main?
# Runs on GitHub, outside Vercel, so it still works when Vercel is the problem.
# Alerts #ops-alerts once when production is behind for over 15 min, and once
# when back in sync (in the alert's thread when the bot token is set). Never deploys.
# Logic: .github/scripts/prod-drift-check.mjs
name: Production drift check

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      pretend_live_sha:
        description: 'TEST ONLY: pretend production runs this commit. Posts one [TEST] alert; changes nothing.'
        required: false
        default: ''

# One push run at a time (a newer push supersedes a waiting one); scheduled and
# manual runs are separate groups so they are never cancelled by a push.
concurrency:
  group: prod-drift-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      # A normal deploy takes a couple of minutes. Check /api/version every 30 s
      # and move on as soon as it reports this push's commit. After 20 minutes
      # stop waiting: the push is then past the 15-minute threshold, so the
      # check below posts the alert.
      - name: Wait for the push to go live
        if: github.event_name == 'push'
        env:
          PROD_URL: https://www.discocater.com
          PUSHED_SHA: ${{ github.sha }}
        run: |
          deadline=$(( $(date +%s) + 1200 ))
          while :; do
            live=$(curl -fsS -m 10 -H 'Cache-Control: no-cache' "$PROD_URL/api/version?t=$(date +%s)" | sed -n 's/.*"sha":"\([0-9a-f]*\)".*/\1/p' || true)
            if [ "$live" = "$PUSHED_SHA" ]; then echo "Live at ${live:0:7} after $(( 1200 - deadline + $(date +%s) )) s."; exit 0; fi
            if [ "$(date +%s)" -ge "$deadline" ]; then echo "Not live after 20 min (production reports ${live:-nothing}); the check below decides whether to alert."; exit 0; fi
            sleep 30
          done
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Compare main with production
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_WEBHOOK: ${{ secrets.OPS_ALERTS_SLACK_WEBHOOK }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_OPS_ALERTS_BOT_TOKEN }}
          PROD_URL: https://www.discocater.com
          PRETEND_LIVE_SHA: ${{ github.event.inputs.pretend_live_sha }}
        run: node .github/scripts/prod-drift-check.mjs
